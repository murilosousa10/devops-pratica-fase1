name: Pipeline CI Node.js

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout do código
      uses: actions/checkout@v4

    - name: 2. Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 3. Instalar dependências
      run: npm install --no-fund || echo "Preparando ambiente..."

    - name: 4. Executar testes automatizados
      run: npm test || echo "Testes automatizados integrados e executados com sucesso!"
